<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Dev </title>

  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    body {
      background: #0f172a;
    }

    .spinner {
      width: 50px;
      height: 50px;
      border: 5px solid #334155;
      border-top: 5px solid #22c55e;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: auto;
    }

    @keyframes spin {
      100% {
        transform: rotate(360deg);
      }
    }
  </style>
</head>

<body class="text-white min-h-screen p-6">

  <div class="max-w-6xl mx-auto">

    <h1 class="text-5xl font-bold text-center mb-8 text-green-400">
      Dev Detective
    </h1>

    <div class="flex justify-center gap-4 mb-6">
      <button id="searchModeBtn" class="bg-green-500 px-5 py-2 rounded">
        Search Mode
      </button>

      <button id="battleModeBtn" class="bg-slate-700 px-5 py-2 rounded">
        Battle Mode
      </button>
    </div>

    <div id="searchSection">

      <div class="flex gap-3 mb-4">

        <input id="username" type="text" placeholder="Enter GitHub Username" class="flex-1 p-3 rounded text-black" />

        <button id="searchBtn" class="bg-green-500 px-6 rounded">
          Search
        </button>

      </div>

      <div id="history" class="flex flex-wrap gap-2 mb-4"></div>

      <div id="result"></div>

    </div>
    <!-- battle section -->

    <div id="battleSection" class="hidden">

      <div class="grid md:grid-cols-2 gap-4 mb-4">

        <input id="player1" type="text" placeholder="Player 1 Username" class="p-3 rounded text-black" />

        <input id="player2" type="text" placeholder="Player 2 Username" class="p-3 rounded text-black" />

      </div>

      <button id="battleBtn" class="bg-red-500 px-6 py-3 rounded mb-6">
        Start Battle
      </button>

      <div id="battleResult"></div>

    </div>

  </div>

  <script src="script.js"></script>

</body>

</html>
